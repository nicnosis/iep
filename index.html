<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>International Energy Partners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Outfit:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1C1A16;
      color: #FAFAF7;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .logo {
      width: 48px;
      margin-bottom: 2.5rem;
      opacity: 0.85;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 400;
      color: #B8924A;
      text-align: center;
      margin-bottom: 1rem;
      letter-spacing: 0.01em;
    }

    p {
      font-size: 1rem;
      font-weight: 300;
      color: #FAFAF7cc;
      text-align: center;
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    a.cta {
      display: inline-block;
      padding: 0.85rem 2.2rem;
      border: 1px solid #B8924A;
      color: #B8924A;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    a.cta:hover {
      background: #B8924A;
      color: #1C1A16;
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      color: #FAFAF755;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <img class="logo" src="assets/spiral.svg" alt="IEP" />

  <h1>This site is currently unavailable.</h1>

  <p>
    An outstanding invoice must be settled before this website goes live.
    Please reach out to resolve the balance.
  </p>

  <a class="cta" href="mailto:nic.jsb@gmail.com">Contact to Resolve</a>

  <footer>International Energy Partners &mdash; spectreequity.com</footer>

</body>
</html>
